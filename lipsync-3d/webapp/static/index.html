<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lip-Sync Studio</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="logo">Lip-Sync <span>Studio</span></div>
  <span class="badge" id="engine"></span>
  <span class="badge" id="gpu"></span>
  <div class="spacer"></div>
  <button class="ghost small" id="btnKeys">API keys</button>
  <button class="ghost small" id="btnUsers" hidden>Users</button>
  <button class="ghost small" id="btnPw" hidden>Password</button>
  <span class="badge" id="who"></span>
  <button class="ghost small" id="btnOut" hidden>Sign out</button>
</header>
<div id="warn"></div>

<main>
  <section class="panel">
    <h2>New lip-sync</h2>
    <div class="tabs">
      <button data-kind="clip" class="on">Clip</button>
      <button data-kind="auto">Full video (auto)</button>
    </div>
    <p class="hint" id="kindHint"></p>

    <label>Video</label>
    <div class="drop" id="dropVideo">
      <input type="file" accept="video/*,.mov,.mkv,.avi,.webm,.mp4">
      <div class="msg">Drop a video here or click — mp4, mov, mkv, HEVC, ProRes…</div>
      <div class="bar"><i></i></div>
    </div>

    <div id="clipOnly">
      <label>New dialogue audio <span style="opacity:.7">(optional — empty re-syncs to the video's own sound)</span></label>
      <div class="drop" id="dropAudio">
        <input type="file" accept="audio/*,video/*">
        <div class="msg">Drop audio here or click</div>
        <div class="bar"><i></i></div>
      </div>
      <label>If audio and video lengths differ</label>
      <select id="mode">
        <option value="cut">Cut — stop at the shorter one</option>
        <option value="loop">Loop — repeat the video to fit the audio</option>
        <option value="bounce">Bounce — play video forward/back to fit</option>
      </select>

      <label>Face to sync</label>
      <div class="row">
        <div><input id="faceT" type="number" step="0.1" min="0" value="0.5" title="seconds"></div>
        <button id="btnFaces" disabled>Find faces at this second</button>
      </div>
      <p class="hint" id="faceHint">Leave it and the most confident face is used automatically, or find faces and click the one you want.</p>
      <div class="picker" id="picker" hidden><canvas id="cv"></canvas></div>
      <div class="facelist" id="faceList"></div>
      <div id="manualSize" hidden>
        <label>Face size (manual pick) — <span id="sizeVal">25</span>% of frame height</label>
        <input type="range" id="size" min="5" max="80" value="25">
      </div>
    </div>

    <details>
      <summary>Settings</summary>
      <div class="grid2">
        <div><label>Quality (steps)</label><input id="steps" type="number" value="20" min="5" max="60"></div>
        <div><label>Lip strength (guidance)</label><input id="guidance" type="number" value="1.5" step="0.1" min="1" max="3.5"></div>
        <div><label>Seed</label><input id="seed" type="number" value="1247"></div>
        <div><label>Max crop px (lower = less VRAM)</label><input id="cropMax" type="number" value="768" step="64" min="256" max="2048"></div>
        <div><label>Detector confidence (lower for 3D/cartoon)</label><input id="score" type="number" value="0.5" step="0.05" min="0.1" max="0.95"></div>
      </div>
      <div id="autoOnly" hidden>
        <div class="grid2">
          <div><label>Speech threshold (dB over noise)</label><input id="thr" type="number" value="12" step="1"></div>
          <div><label>Join pauses shorter than (s)</label><input id="gap" type="number" value="0.4" step="0.05"></div>
          <div><label>Pad before (s)</label><input id="padB" type="number" value="0.15" step="0.05"></div>
          <div><label>Pad after (s)</label><input id="padA" type="number" value="0.2" step="0.05"></div>
        </div>
      </div>
    </details>

    <button class="primary submit" id="btnGo" disabled>Lip sync</button>
    <div class="err" id="err"></div>
  </section>

  <section class="panel">
    <h2 style="display:flex;justify-content:space-between;align-items:center">
      <span>Jobs</span>
      <label style="margin:0;display:flex;gap:6px;align-items:center" id="allWrap" hidden>
        <input type="checkbox" id="all" style="width:auto"> everyone's
      </label>
    </h2>
    <div class="jobs" id="jobs"><div class="empty">No jobs yet.</div></div>
  </section>
</main>

<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<script src="/static/app.js"></script>
</body>
</html>
